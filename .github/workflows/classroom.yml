name: Autograding Tests

on:
  push:
    branches: [ main ]
  repository_dispatch:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: split_vertically
        id: split-vertically
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: split_vertically
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_split_vertically
          timeout: 10
          max-score: 10

      - name: split_horizontally
        id: split-horizontally
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: split_horizontally
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_split_horizontally
          timeout: 10
          max-score: 10

      - name: split_and_merge_vertically
        id: split-and-merge-vertically
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: split_and_merge_vertically
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_split_and_merge_vertically
          timeout: 10
          max-score: 10

      - name: split_and_merge_horizontally
        id: split-and-merge-horizontally
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: split_and_merge_horizontally
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_split_and_merge_horizontally
          timeout: 10
          max-score: 10

      - name: rotate_array
        id: rotate-array
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: rotate_array
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_rotate_array
          timeout: 10
          max-score: 10

      - name: rotate_array_empty
        id: rotate-array-empty
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: rotate_array_empty
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_rotate_array_empty
          timeout: 10
          max-score: 5

      - name: create_array_int_cast
        id: create-array-int-cast
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: create_array_int_cast
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_create_array_int_cast
          timeout: 10
          max-score: 10

      - name: create_array_float
        id: create-array-float
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: create_array_float
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_create_array_float
          timeout: 10
          max-score: 10

      - name: evaluate_basic_ops
        id: evaluate-basic-ops
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: evaluate_basic_ops
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_evaluate_basic_ops
          timeout: 10
          max-score: 10

      - name: evaluate_unary_ops
        id: evaluate-unary-ops
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: evaluate_unary_ops
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_evaluate_unary_ops
          timeout: 10
          max-score: 10

      - name: evaluate_errors
        id: evaluate-errors
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: evaluate_errors
          setup-command: ""
          command: pytest -q tests/test_numpy_programming_exercises.py::test_evaluate_errors
          timeout: 10
          max-score: 5

      - name: Calculate total score
        id: calc-score
        if: always()
        run: |
          score=0

          [ "${{ steps.split-vertically.outcome }}" = "success" ] && score=$((score + 10))
          [ "${{ steps.split-horizontally.outcome }}" = "success" ] && score=$((score + 10))
          [ "${{ steps.split-and-merge-vertically.outcome }}" = "success" ] && score=$((score + 10))
          [ "${{ steps.split-and-merge-horizontally.outcome }}" = "success" ] && score=$((score + 10))
          [ "${{ steps.rotate-array.outcome }}" = "success" ] && score=$((score + 10))
          [ "${{ steps.rotate-array-empty.outcome }}" = "success" ] && score=$((score + 5))
          [ "${{ steps.create-array-int-cast.outcome }}" = "success" ] && score=$((score + 10))
          [ "${{ steps.create-array-float.outcome }}" = "success" ] && score=$((score + 10))
          [ "${{ steps.evaluate-basic-ops.outcome }}" = "success" ] && score=$((score + 10))
          [ "${{ steps.evaluate-unary-ops.outcome }}" = "success" ] && score=$((score + 10))
          [ "${{ steps.evaluate-errors.outcome }}" = "success" ] && score=$((score + 5))

          echo "score=$score" >> "$GITHUB_OUTPUT"
          echo "Calculated score: $score"

      - name: Show calculated score
        if: always()
        run: |
          echo "Final score = ${{ steps.calc-score.outputs.score }}/100"

      - name: Map GitHub user to Moodle student ID
        id: map-student
        if: always()
        run: |
          echo "GitHub actor is: $GITHUB_ACTOR"

          python <<'PY'
          import csv
          import os
          import sys

          github_actor = os.environ["GITHUB_ACTOR"].strip().lower()
          csv_path = "github_moodle_map.csv"

          moodle_student_id = None

          with open(csv_path, newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              for row in reader:
                  gh = row["github_username"].strip().lower()
                  if gh == github_actor:
                      moodle_student_id = row["moodle_student_id"].strip()
                      break

          if not moodle_student_id:
              print(f"No Moodle mapping found for GitHub user: {github_actor}")
              sys.exit(1)

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as out:
              out.write(f"moodle_student_id={moodle_student_id}\n")

          print(f"Mapped {github_actor} -> Moodle student ID {moodle_student_id}")
          PY


      - name: Send actual score to Moodle
        if: always()
        run: |
          echo "Sending score ${{ steps.calc-score.outputs.score }} to Moodle"
          echo "URL: ${{ secrets.MOODLE_URL }}webservice/rest/server.php"
      
          curl -X POST "https://staging.izen.ai/webservice/rest/server.php" \
            -d "wstoken=${{ secrets.MOODLE_TOKEN }}" \
            -d "wsfunction=core_grades_update_grades" \
            -d "moodlewsrestformat=json" \
            -d "source=github" \
            -d "courseid=${{ secrets.MOODLE_COURSE_ID }}" \
            -d "component=mod_lti" \
            -d "activityid=${{ secrets.MOODLE_ACTIVITY_ID }}" \
            -d "itemnumber=0" \
            -d "grades[0][studentid]=${{ steps.map-student.outputs.moodle_student_id }}" \
            -d "grades[0][grade]=${{ steps.calc-score.outputs.score }}"
